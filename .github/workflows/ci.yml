name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm (standalone binary)
        shell: bash
        run: |
          version="$(node -p "require('./package.json').packageManager.split('@').pop()")"
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)     asset="pnpm-linux-x64.tar.gz" ;;
            Linux-ARM64)   asset="pnpm-linux-arm64.tar.gz" ;;
            macOS-ARM64)   asset="pnpm-darwin-arm64.tar.gz" ;;
            Windows-X64)   asset="pnpm-win32-x64.zip" ;;
            Windows-ARM64) asset="pnpm-win32-arm64.zip" ;;
            *) echo "no pnpm standalone asset for ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          dest="${RUNNER_TEMP}/pnpm-standalone"
          mkdir -p "$dest"
          cd "$dest"
          # --retry alone does not cover connection-level failures like
          # curl 52 "Empty reply from server" (seen flaking on the Windows
          # runners); --retry-all-errors makes every failure retryable.
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 20 -o "$asset" \
            "https://github.com/pnpm/pnpm/releases/download/v${version}/${asset}"
          if [[ "$asset" == *.zip ]]; then
            powershell.exe -NoProfile -Command "Expand-Archive -Path '${asset}' -DestinationPath '.' -Force"
          else
            tar -xzf "$asset"
            chmod +x pnpm
          fi
          rm "$asset"
          ./pnpm --version
          echo "$dest" >> "$GITHUB_PATH"

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Build must precede Typecheck: plugin-cli's façade re-exports
      # @motrix/plugin-manifest-schema, whose `types` resolves to its built
      # dist/index.d.ts — on a clean checkout, typecheck-before-build fails
      # with TS2307.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Schema façade check
        run: pnpm run check:facade
